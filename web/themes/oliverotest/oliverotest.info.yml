# This theme is marked as @internal. It is intended to evolve and change over
# minor releases.
# As the UI of Drupal improves between minor versions, the markup and assets in
# the oliverotest theme will change. The oliverotest theme is not backwards compatible
# If you wish to modify the output or assets of oliverotest you can:
# 1. Copy the whole of oliverotest and rename it as your own theme. You will need to
# manually manage your own updates if you want to stay up to date with oliverotest's
# bug fixes and feature support.
#
# 2. Sub-theme oliverotest. This is only recommended if you want to make minor
# tweaks and understand that oliverotest could break your modifications as it
# changes.
name: oliverotest
type: theme
base theme: false
description: A clean, accessible, and flexible Drupal front-end theme.
alt text: Screenshot of oliverotest, Drupal front-end theme.
package: Core
# version: VERSION
libraries:
  - oliverotest/global-styling
regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  hero: Hero (full width)
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: Social Bar
  content_above: Content Above
  content: Content
  sidebar: Sidebar
  content_below: Content Below
  footer_top: Footer Top
  footer_bottom: Footer Bottom
libraries-override:
  core/drupal.ajax:
    css:
      component:
        core/components/ajax-progress.module.css: css/components/ajax-progress.module.css
  core/drupal.autocomplete:
    css:
      component:
        core/components/autocomplete-loading.module.css: css/components/autocomplete-loading.module.css
  system/admin:
    css:
      theme:
        css/system.admin.css: false
  core/drupal.checkbox: false
  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: css/components/dropbutton.css
  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: css/components/vertical-tabs.css
  media/oembed.formatter: false
  layout_builder/twocol_section: oliverotest/layout_builder_twocol_section
  layout_builder/threecol_section: oliverotest/layout_builder_threecol_section
  layout_builder/fourcol_section: oliverotest/layout_builder_fourcol_section
libraries-extend:
  core/drupal.message:
    - oliverotest/drupal.message
  core/drupal.collapse:
    - oliverotest/details
  core/drupal.dialog:
    - oliverotest/drupal.dialog
  core/drupal.progress:
    - oliverotest/progress
  core/drupal.tabledrag:
    - oliverotest/tabledrag
  layout_discovery/onecol:
    - oliverotest/layout_discovery_section
  layout_discovery/twocol_bricks:
    - oliverotest/layout_discovery_section
  layout_discovery/twocol:
    - oliverotest/layout_discovery_section
  layout_discovery/threecol_25_50_25:
    - oliverotest/layout_discovery_section
  layout_discovery/threecol_33_34_33:
    - oliverotest/layout_discovery_section
  node/drupal.node.preview:
    - oliverotest/drupal.node.preview
  content_moderation/content_moderation:
    - oliverotest/content_moderation

# Information added by Drupal.org packaging script on 2024-09-05
version: '10.3.3'
core_version_requirement: ^10
project: 'drupal'
datestamp: 1725528273
