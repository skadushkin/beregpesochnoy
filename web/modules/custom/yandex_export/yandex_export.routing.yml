yandex_export.admin:
  path: '/admin/config/yandex-export'
  defaults:
    _controller: 'Drupal\yandex_export\Controller\YandexExportController::exportPage'
    _title: 'Экспорт в XML'
  requirements:
    _permission: 'administer site configuration'

yandex_export.feed_projects:
  path: '/projects.xml'
  defaults:
    _controller: 'Drupal\yandex_export\Controller\YandexExportController::serveFeed'
    filename: 'projects.xml'
  requirements:
    _access: 'TRUE'

yandex_export.feed_direct_projects:
  path: '/direct_projects.xml'
  defaults:
    _controller: 'Drupal\yandex_export\Controller\YandexExportController::serveFeed'
    filename: 'direct_projects.xml'
  requirements:
    _access: 'TRUE'

